name: Publish to npm
on:
  # Allows triggering both from release-please workflow and manually
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to build from (tag or branch)"
        required: true
        type: string
      tag:
        description: "Tag to publish (optional)"
        required: false
        type: choice
        options:
          - latest
          - beta
          - alpha
        default: "latest"

  workflow_call:
    inputs:
      git_ref:
        description: "Git ref to build from (tag or branch)"
        required: true
        type: string
      tag:
        description: "Tag to publish (optional)"
        required: false
        type: string
        default: "latest"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # only publish from tags
    if: startsWith(github.event.inputs.git_ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Setup Node.js and .npmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version: "24.x"
          # needed to publish to npm registry
          registry-url: "https://registry.npmjs.org"
          scope: "@openfoodfacts"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: yarn install --immutable --mode=skip-build

      - name: Build project
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Publish to npm
        run: npm publish --tag ${{ github.event.inputs.tag }}
